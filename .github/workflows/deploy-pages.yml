name: CI Rainha das Polpas (Sysotto)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de Tipos TypeScript
        run: npm run typecheck

      - name: Lint de Código
        run: npm run lint

      - name: Testes Unitários
        run: npm test

      - name: Build estático para revisão e integração Sysotto
        env:
          NEXT_PUBLIC_SITE_URL: "https://sites.sysotto.com/rainhadaspolpas"
          NEXT_PUBLIC_BASE_PATH: "/rainhadaspolpas"
        run: npm run build

      - name: Upload de artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: static-out
          path: out/
          retention-days: 7
