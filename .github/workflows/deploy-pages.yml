name: Deploy Rainha das Polpas (Cloudflare Pages)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de Tipos TypeScript
        run: npm run typecheck

      - name: Lint de Código
        run: npm run lint

      - name: Testes Unitários
        run: npm test

      - name: Build Estático Next.js (Cloudflare Jamstack)
        env:
          NEXT_PUBLIC_SITE_URL: "https://sites.sysotto.com/rainhadaspolpas"
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build

      - name: Upload de artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: static-out
          path: out/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download do build
        uses: actions/download-artifact@v4
        with:
          name: static-out
          path: out

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=rainha-das-polpas --commit-dirty=true
